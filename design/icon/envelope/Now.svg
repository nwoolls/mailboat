<!-- Mailboat app icon: a blue M drawn as a ribbon folding over itself at
     each corner (after VS Code's logo), on a flat near-black tile. Fold
     style S4, colour C17 (Apple's system blue, matching Mail);
     a copy of design/icon/choices/C17-system-blue.svg.
     Regenerate every size with `bun tauri icon design/icon/app-icon.svg`
     (then delete src-tauri/icons/android and ios). -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.30"/></filter>
  <filter id="fold" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/></filter>
  
</defs>
