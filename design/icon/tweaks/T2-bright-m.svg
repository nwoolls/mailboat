<!-- Mailboat app icon (UX Spike 1, owner picked variant A3): a sky-blue M
     drawn as an envelope's sides and flap, on a frosted glass card over
     the app's glow, in a macOS rounded square. Regenerate every size with
     `bun tauri icon design/icon/mailboat-icon.svg`. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#132a6b"/><stop offset="0.55" stop-color="#1a1a52"/><stop offset="1" stop-color="#3a1763"/>
  </linearGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity="0.12"/><stop offset="0.45" stop-color="#fff" stop-opacity="0.02"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#5b9bff" stop-opacity="0.75"/><stop offset="0.5" stop-color="#5b9bff" stop-opacity="0.22"/><stop offset="1" stop-color="#5b9bff" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity="0.24"/><stop offset="1" stop-color="#fff" stop-opacity="0.06"/>
  </linearGradient>
  <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#8fc2ff"/>
  </linearGradient>
  <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffffff"/><stop offset="0.6" stop-color="#cfe6ff"/><stop offset="1" stop-color="#7fb4ff"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.35"/>
  </filter>
  <filter id="mglow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="16" result="b"/><feFlood flood-color="#6aa8ff" flood-opacity="0.9"/><feComposite in2="b" operator="in" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)" filter="url(#shadow)"/>
<rect x="100" y="100" width="824" height="824" rx="186" fill="url(#sheen)"/>
<rect x="101.5" y="101.5" width="821" height="821" rx="185" fill="none" stroke="#fff" stroke-opacity="0.14" stroke-width="3"/>
<circle cx="512" cy="520" r="390" fill="url(#glow)" opacity="0.75"/>
<rect x="178" y="270" width="668" height="484" rx="86" fill="url(#glass)" stroke="#fff" stroke-opacity="0.45" stroke-width="5"/>
<path d="M 262 670 L 262 362 L 512 556 L 762 362 L 762 670" fill="none" stroke="url(#sky)" stroke-width="62" stroke-linecap="round" stroke-linejoin="round" filter="url(#mglow)"/>
</svg>
