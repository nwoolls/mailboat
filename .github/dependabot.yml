version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    # A release must be a week old before it is proposed, so a malicious
    # version found and pulled in its first days never reaches us (Semgrep).
    cooldown: { default-days: 7 }
    groups:
      cargo: { patterns: ["*"] }
  - package-ecosystem: bun
    directory: /
    schedule: { interval: weekly }
    # A release must be a week old before it is proposed, so a malicious
    # version found and pulled in its first days never reaches us (Semgrep).
    cooldown: { default-days: 7 }
    groups:
      bun: { patterns: ["*"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    # A release must be a week old before it is proposed, so a malicious
    # version found and pulled in its first days never reaches us (Semgrep).
    cooldown: { default-days: 7 }
    groups:
      actions: { patterns: ["*"] }
