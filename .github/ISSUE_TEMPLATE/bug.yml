name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: "Shown in Settings → About"
    validations: { required: true }
  - type: dropdown
    id: os
    attributes:
      label: System
      options: [macOS, Windows]
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to see it
      description: "What you did, what you expected, what happened. Please describe it in general terms with made-up names and addresses: no real senders, people, companies, subjects, message text, counts or screenshots of your own mail (demo mode screenshots are fine)."
    validations: { required: true }
  - type: textarea
    id: log
    attributes:
      label: Sync log (optional)
      description: "Only the relevant lines of `sync.log`, after removing account names and addresses, counts, timings and timestamps, file paths and any error text that identifies mail. It holds no email content, but it does name accounts and activity."
