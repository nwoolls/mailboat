name: Release

# Signed builds, started by hand from the Actions tab (a version tag will start
# them later, once publishing is built). Each job waits for the owner's approval
# in the `release` environment, which holds the signing secrets and only lets
# `main` use them, so a pull request can never reach them.
#
# Today this builds, signs and notarizes the Mac app, builds and signs the
# Windows installers (x64 and ARM64), and keeps the results as artifacts for a
# week. Publishing and the update file follow in their own changes.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  macos:
    name: Mac (Apple silicon)
    runs-on: macos-latest
    environment: release
    timeout-minutes: 90
    defaults:
      run:
        # An explicit bash also fails a step when any command in a pipeline fails.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check this is an Apple silicon runner
        run: |
          arch="$(uname -m)"
          if [ "$arch" != "arm64" ]; then
            echo "Expected an Apple silicon runner, got $arch" >&2
            exit 1
          fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true
      - run: bun install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # No build cache here: a release is built from scratch.
      - name: Import the signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: scripts/import-apple-certificate.sh
      - name: Build, sign and notarize
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          # Tauri reads the notarization key from a file.
          key_file="$RUNNER_TEMP/notarization-key.p8"
          (umask 077 && printf '%s' "$APPLE_API_KEY_CONTENT" > "$key_file")
          export APPLE_API_KEY_PATH="$key_file"
          # Tauri reads the path, not the key itself: don't leave the key in
          # the environment of the build.
          unset APPLE_API_KEY_CONTENT
          bun tauri build --ci --bundles app,dmg
      - name: Notarize the disk image
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          # Tauri notarizes the app inside the disk image and signs the image,
          # but doesn't notarize the image itself, which Gatekeeper then calls
          # unnotarized. The key file is the one the build step wrote.
          shopt -s nullglob
          dmgs=(target/release/bundle/dmg/*.dmg)
          if [ "${#dmgs[@]}" -ne 1 ]; then
            echo "Expected one .dmg, found ${#dmgs[@]}" >&2
            exit 1
          fi
          key=(--key "$RUNNER_TEMP/notarization-key.p8" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER")
          # A time limit, so a stuck submission can't hold the job for its
          # whole 90 minutes (Apple goes on processing it either way).
          result="$(xcrun notarytool submit "${dmgs[0]}" "${key[@]}" \
            --wait --timeout 30m --output-format json)"
          echo "$result"
          # `notarytool` can finish normally with a refusal in its answer.
          status="$(printf '%s' "$result" | plutil -extract status raw -o - -)"
          if [ "$status" != "Accepted" ]; then
            echo "Apple's notary service did not accept the disk image: $status" >&2
            id="$(printf '%s' "$result" | plutil -extract id raw -o - - || true)"
            if [ -n "$id" ]; then
              xcrun notarytool log "$id" "${key[@]}" /dev/stdout || true
            fi
            exit 1
          fi
          # The ticket can take a moment to be available after Apple accepts.
          stapled=
          for attempt in 1 2 3 4 5 6; do
            if xcrun stapler staple "${dmgs[0]}"; then
              stapled=1
              break
            fi
            if [ "$attempt" -lt 6 ]; then
              echo "No ticket yet (try $attempt of 6); waiting 10 seconds" >&2
              sleep 10
            fi
          done
          if [ -z "$stapled" ]; then
            echo "Apple accepted the disk image, but no ticket could be stapled after 6 tries" >&2
            exit 1
          fi
      - name: Check the build and keep it
        run: |
          # Exactly one app and one disk image, or something is wrong.
          shopt -s nullglob
          apps=(target/release/bundle/macos/*.app)
          dmgs=(target/release/bundle/dmg/*.dmg)
          if [ "${#apps[@]}" -ne 1 ] || [ "${#dmgs[@]}" -ne 1 ]; then
            echo "Expected one .app and one .dmg, found ${#apps[@]} and ${#dmgs[@]}" >&2
            exit 1
          fi
          app="${apps[0]}"
          dmg="${dmgs[0]}"
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute -vv "$app"
          # The app and its helper must both be Apple silicon only.
          for binary in "$app"/Contents/MacOS/*; do
            archs="$(lipo -archs "$binary")"
            if [ "$archs" != "arm64" ]; then
              echo "$(basename "$binary") is $archs, expected arm64" >&2
              exit 1
            fi
          done
          # The disk image: signed, notarized, ticket attached.
          codesign --verify --verbose=2 "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature -vv "$dmg"
          mkdir -p release-files
          # ditto keeps what a plain zip would lose (permissions, the ticket).
          ditto -c -k --keepParent "$app" "release-files/$(basename "$app").zip"
          cp "$dmg" release-files/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-signed
          path: release-files/*
          if-no-files-found: error
          retention-days: 7
      - name: Remove the keychain and the key file
        if: always()
        run: |
          if [ -n "${RELEASE_KEYCHAIN:-}" ]; then
            security delete-keychain "$RELEASE_KEYCHAIN" || true
          fi
          rm -f "$RUNNER_TEMP/notarization-key.p8" "$RUNNER_TEMP/certificate.p12"

  windows:
    name: Windows (${{ matrix.arch }})
    runs-on: macos-latest
    environment: release
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write # lets this job ask GitHub for the token Azure trusts, for the `release` environment only
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: ARM64
            target: aarch64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true
      - run: bun install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      # The Windows installers are cross-built on a Mac, as scripts/windows.sh
      # does on the owner's machine (docs/DEVELOPMENT.md), then signed with
      # scripts/sign-windows.sh through Azure Artifact Signing.
      - name: Install the Windows build tools
        run: |
          brew install llvm lld nsis jsign sevenzip
          cargo install cargo-xwin --locked --version 0.23.1
      - name: Sign in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          # Signing only needs the tenant-level token, and the signing service
          # checks the app's role on the certificate profile. No subscription
          # is needed, so the login doesn't depend on seeing one.
          allow-no-subscriptions: true
      - name: Fetch the signing token now
        # GitHub's login token lasts about five minutes, and Azure CLI can only
        # use it to get a token for a service while it is fresh. Getting the
        # signing service's token right after login caches it (for about an
        # hour), so the per-file signing calls during the long build find it.
        run: az account get-access-token --resource https://codesigning.azure.net --output none
      - name: Build and sign the installer
        env:
          WINDOWS_TARGET: ${{ matrix.target }}
          WINDOWS_SIGN: "1"
          WINDOWS_SIGN_ENDPOINT: ${{ vars.WINDOWS_SIGN_ENDPOINT }}
          WINDOWS_SIGN_ALIAS: ${{ vars.WINDOWS_SIGN_ALIAS }}
        run: scripts/windows.sh build
      - name: Check the signatures and keep the installer
        env:
          WINDOWS_TARGET: ${{ matrix.target }}
        run: |
          shopt -s nullglob
          installers=("target/$WINDOWS_TARGET/release/bundle/nsis/"*.exe)
          if [ "${#installers[@]}" -ne 1 ]; then
            echo "Expected one installer, found ${#installers[@]}" >&2
            exit 1
          fi
          # The installer, and the app and uninstaller inside it, must be signed.
          bun scripts/check-windows-signature.ts "${installers[0]}"
          mkdir -p release-files
          cp "${installers[0]}" release-files/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-signed-${{ matrix.arch }}
          path: release-files/*
          if-no-files-found: error
          retention-days: 7
      - name: Sign out of Azure
        if: always()
        run: az logout || true
