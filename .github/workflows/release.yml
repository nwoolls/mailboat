name: Release

# Signed builds. A version tag (v0.1.0) starts a release; the Actions tab's
# "Run workflow" makes the same builds without publishing, to try them. Each
# build job waits for the owner's approval in the `release` environment, which
# holds the signing secrets and lets only `main` and `v*` tags use them, so a
# pull request can never reach them.
#
# It builds, signs and notarizes the Mac app, builds and signs the Windows
# installers (x64 and ARM64), builds the Linux packages (.deb, .rpm and
# AppImage, for x86-64 and Arm), and has Tauri sign each update payload with
# the updater key. For a tag, a last job then checks every update signature against
# the public key in the app, writes the update manifest (`latest.json`) and the
# checksums, attests where the files came from, and makes a DRAFT GitHub Release.
# The owner reads it and publishes it by hand: only a published release is
# what the app's update address (a redirect to the latest release) shows.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Check the tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true
      # Only for a tag: a run started by hand just makes builds. Seconds, so a
      # mistake costs no build.
      - name: The tag matches the version and has release notes
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: bun scripts/check-release-tag.ts "$TAG"
      # The checkout (full history, so origin/main is there) has the token; later
      # git commands are unauthenticated, which a private repository would refuse.
      - name: The tag is on main
        if: github.ref_type == 'tag'
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "This tag isn't on main: merge the release to main, then tag that commit." >&2
            exit 1
          fi

  macos:
    name: Mac (Apple silicon)
    needs: check
    runs-on: macos-latest
    environment: release
    timeout-minutes: 90
    defaults:
      run:
        # An explicit bash also fails a step when any command in a pipeline fails.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check this is an Apple silicon runner
        run: |
          arch="$(uname -m)"
          if [ "$arch" != "arm64" ]; then
            echo "Expected an Apple silicon runner, got $arch" >&2
            exit 1
          fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true
      - run: bun install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # No build cache here: a release is built from scratch.
      - name: Import the signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: scripts/import-apple-certificate.sh
      - name: Build, sign and notarize
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          # The updater's key: Tauri signs the update payload with it, last.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # Tauri reads the notarization key from a file.
          key_file="$RUNNER_TEMP/notarization-key.p8"
          (umask 077 && printf '%s' "$APPLE_API_KEY_CONTENT" > "$key_file")
          export APPLE_API_KEY_PATH="$key_file"
          # Tauri reads the path, not the key itself: don't leave the key in
          # the environment of the build.
          unset APPLE_API_KEY_CONTENT
          bun tauri build --ci --bundles app,dmg --config src-tauri/tauri.updater-artifacts.conf.json
      - name: Notarize the disk image
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          # Tauri notarizes the app inside the disk image and signs the image,
          # but doesn't notarize the image itself, which Gatekeeper then calls
          # unnotarized. The key file is the one the build step wrote.
          shopt -s nullglob
          dmgs=(target/release/bundle/dmg/*.dmg)
          if [ "${#dmgs[@]}" -ne 1 ]; then
            echo "Expected one .dmg, found ${#dmgs[@]}" >&2
            exit 1
          fi
          key=(--key "$RUNNER_TEMP/notarization-key.p8" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER")
          # A time limit, so a stuck submission can't hold the job for its
          # whole 90 minutes (Apple goes on processing it either way).
          result="$(xcrun notarytool submit "${dmgs[0]}" "${key[@]}" \
            --wait --timeout 30m --output-format json)"
          echo "$result"
          # `notarytool` can finish normally with a refusal in its answer.
          status="$(printf '%s' "$result" | plutil -extract status raw -o - -)"
          if [ "$status" != "Accepted" ]; then
            echo "Apple's notary service did not accept the disk image: $status" >&2
            id="$(printf '%s' "$result" | plutil -extract id raw -o - - || true)"
            if [ -n "$id" ]; then
              xcrun notarytool log "$id" "${key[@]}" /dev/stdout || true
            fi
            exit 1
          fi
          # The ticket can take a moment to be available after Apple accepts.
          stapled=
          for attempt in 1 2 3 4 5 6; do
            if xcrun stapler staple "${dmgs[0]}"; then
              stapled=1
              break
            fi
            if [ "$attempt" -lt 6 ]; then
              echo "No ticket yet (try $attempt of 6); waiting 10 seconds" >&2
              sleep 10
            fi
          done
          if [ -z "$stapled" ]; then
            echo "Apple accepted the disk image, but no ticket could be stapled after 6 tries" >&2
            exit 1
          fi
      - name: Check the build and keep it
        run: |
          # Exactly one app and one disk image, or something is wrong.
          shopt -s nullglob
          apps=(target/release/bundle/macos/*.app)
          dmgs=(target/release/bundle/dmg/*.dmg)
          if [ "${#apps[@]}" -ne 1 ] || [ "${#dmgs[@]}" -ne 1 ]; then
            echo "Expected one .app and one .dmg, found ${#apps[@]} and ${#dmgs[@]}" >&2
            exit 1
          fi
          app="${apps[0]}"
          dmg="${dmgs[0]}"
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute -vv "$app"
          # The app and its helper must both be Apple silicon only.
          for binary in "$app"/Contents/MacOS/*; do
            archs="$(lipo -archs "$binary")"
            if [ "$archs" != "arm64" ]; then
              echo "$(basename "$binary") is $archs, expected arm64" >&2
              exit 1
            fi
          done
          # The disk image: signed, notarized, ticket attached.
          codesign --verify --verbose=2 "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature -vv "$dmg"
          # The update payload (the app in a tarball) and its signature.
          payloads=(target/release/bundle/macos/*.app.tar.gz)
          if [ "${#payloads[@]}" -ne 1 ] || [ ! -s "${payloads[0]}.sig" ]; then
            echo "Expected one .app.tar.gz with a .sig, found ${#payloads[@]}" >&2
            exit 1
          fi
          # The payload must be the notarized app, not a copy made before its
          # ticket was attached: unpack it and check it as we did the app.
          unpacked="$(mktemp -d)"
          tar -xzf "${payloads[0]}" -C "$unpacked"
          xcrun stapler validate "$unpacked"/*.app
          spctl --assess --type execute -vv "$unpacked"/*.app
          # Every binary hardened (DASA 3.3.1, 3.3.2, 3.1.1, 1.5.2), in the
          # app and in the payload updates install.
          bun scripts/check-binaries.ts macos "$app"
          bun scripts/check-binaries.ts macos "$unpacked"/*.app
          mkdir -p release-files
          # ditto keeps what a plain zip would lose (permissions, the ticket).
          ditto -c -k --keepParent "$app" "release-files/$(basename "$app").zip"
          cp "$dmg" "${payloads[0]}" "${payloads[0]}.sig" release-files/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-signed
          path: release-files/*
          if-no-files-found: error
          retention-days: 7
      - name: Remove the keychain and the key file
        if: always()
        run: |
          if [ -n "${RELEASE_KEYCHAIN:-}" ]; then
            security delete-keychain "$RELEASE_KEYCHAIN" || true
          fi
          rm -f "$RUNNER_TEMP/notarization-key.p8" "$RUNNER_TEMP/certificate.p12"

  windows:
    name: Windows (${{ matrix.arch }})
    needs: check
    runs-on: macos-latest
    environment: release
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write # lets this job ask GitHub for the token Azure trusts, for the `release` environment only
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: ARM64
            target: aarch64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true
      - run: bun install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      # The Windows installers are cross-built on a Mac, as scripts/windows.sh
      # does on the owner's machine (docs/DEVELOPMENT.md), then signed with
      # scripts/sign-windows.sh through Azure Artifact Signing.
      - name: Install the Windows build tools
        run: |
          brew install llvm lld nsis jsign sevenzip
          cargo install cargo-xwin --locked --version 0.23.1
      - name: Sign in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          # Signing only needs the tenant-level token, and the signing service
          # checks the app's role on the certificate profile. No subscription
          # is needed, so the login doesn't depend on seeing one.
          allow-no-subscriptions: true
      - name: Fetch the signing token now
        # GitHub's login token lasts about five minutes, and Azure CLI can only
        # use it to get a token for a service while it is fresh. Getting the
        # signing service's token right after login caches it (for about an
        # hour), so the per-file signing calls during the long build find it.
        run: az account get-access-token --resource https://codesigning.azure.net --output none
      - name: Build and sign the installer
        env:
          WINDOWS_TARGET: ${{ matrix.target }}
          WINDOWS_SIGN: "1"
          WINDOWS_SIGN_ENDPOINT: ${{ vars.WINDOWS_SIGN_ENDPOINT }}
          WINDOWS_SIGN_ALIAS: ${{ vars.WINDOWS_SIGN_ALIAS }}
          # The installer is the update payload: Tauri signs it with the
          # updater key after the Authenticode signing (checked by hand).
          UPDATER_ARTIFACTS: "1"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: scripts/windows.sh build
      # The program's hardening (DASA 2.1.1 to 2.1.4): ASLR, DEP, Control
      # Flow Guard, high-entropy ASLR, 64-bit. Homebrew's llvm (installed
      # above) reads it.
      - name: Check the program's hardening
        env:
          WINDOWS_TARGET: ${{ matrix.target }}
        run: bun scripts/check-binaries.ts windows "$WINDOWS_TARGET"
      - name: Check the signatures and keep the installer
        env:
          WINDOWS_TARGET: ${{ matrix.target }}
        run: |
          shopt -s nullglob
          installers=("target/$WINDOWS_TARGET/release/bundle/nsis/"*.exe)
          if [ "${#installers[@]}" -ne 1 ]; then
            echo "Expected one installer, found ${#installers[@]}" >&2
            exit 1
          fi
          # The installer, and the app and uninstaller inside it, must be signed.
          bun scripts/check-windows-signature.ts "${installers[0]}"
          # Its update signature, made by Tauri after that.
          if [ ! -s "${installers[0]}.sig" ]; then
            echo "${installers[0]} has no .sig" >&2
            exit 1
          fi
          mkdir -p release-files
          cp "${installers[0]}" "${installers[0]}.sig" release-files/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-signed-${{ matrix.arch }}
          path: release-files/*
          if-no-files-found: error
          retention-days: 7
      - name: Sign out of Azure
        if: always()
        run: az logout || true

  # Linux is built without any secret: the AppImage's tools run here, so
  # they never see the updater key. They are checked against recorded
  # digests (scripts/appimage-tools.sh) so Tauri doesn't fetch its own. A
  # job of its own then signs what was built (linux-sign).
  linux:
    name: Linux (${{ matrix.arch }})
    needs: check
    # The oldest Ubuntu Tauri supports, so the packages run on distributions
    # as old as it (their glibc); Arm on GitHub's own Arm runner.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64
            runner: ubuntu-22.04
          - arch: Arm
            runner: ubuntu-22.04-arm
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # WebKitGTK and GTK (the web view and window), D-Bus (the keychain),
      # and rpm to make the .rpm.
      # squashfs-tools to unpack the AppImage for its bill without running it.
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libdbus-1-dev rpm squashfs-tools
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true
      - run: bun install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: scripts/appimage-tools.sh
      # No build cache here: a release is built from scratch. The AppImage's
      # runtime is the pinned one (appimagetool would download its own).
      - run: LDAI_RUNTIME_FILE="${XDG_CACHE_HOME:-$HOME/.cache}/tauri/appimage-runtime" bun tauri build --ci --bundles deb,rpm,appimage
      - name: Check the packages and keep them
        run: |
          shopt -s nullglob
          mkdir -p release-files
          for kind in deb rpm appimage; do
            case "$kind" in appimage) files=(target/release/bundle/appimage/*.AppImage) ;;
                            *) files=(target/release/bundle/"$kind"/*."$kind") ;; esac
            if [ "${#files[@]}" -ne 1 ]; then
              echo "Expected one .$kind, found ${#files[@]}" >&2
              exit 1
            fi
            cp "${files[0]}" release-files/
          done
          # The program as the .deb installs it (the others hold the same
          # one): 64-bit, PIE, a stack that can't run code, full RELRO, no
          # RPATH; and marked as a .deb, which is how the updater picks
          # the package it installs.
          unpacked="$(mktemp -d)"
          dpkg-deb -x release-files/*.deb "$unpacked"
          name="$(jq -r .mainBinaryName src-tauri/tauri.conf.json)"
          bun scripts/check-binaries.ts linux "$unpacked/usr/bin/$name"
          grep -q __TAURI_BUNDLE_TYPE_VAR_DEB "$unpacked/usr/bin/$name"
          # The AppImage's runtime is the pinned one, then its own bill of
          # materials: the runtime, and the system libraries it carries,
          # traced to the packages installed here.
          runtime="${XDG_CACHE_HOME:-$HOME/.cache}/tauri/appimage-runtime"
          bun scripts/check-appimage-runtime.ts release-files/*.AppImage "$runtime"
          version="$(jq -r .version package.json)"
          bun scripts/make-appimage-sbom.ts --appimage release-files/*.AppImage \
            --runtime "$runtime" --version "$version" --out release-files
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-unsigned-${{ matrix.arch }}
          path: release-files/*
          if-no-files-found: error
          retention-days: 7

  # Signs the Linux packages for the updater, in a job that runs nothing but
  # the signer (the Tauri CLI, from the lockfile, its install scripts off).
  # Each signature is bound to the version (--app-version), as `tauri build`
  # does on the Mac and Windows.
  linux-sign:
    name: Sign Linux (${{ matrix.arch }})
    needs: linux
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arch: [x86-64, Arm]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-unsigned-${{ matrix.arch }}
          path: release-files
      - name: Sign the packages
        env:
          ARCH: ${{ matrix.arch }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          version="$(jq -r .version package.json)"
          name="$(jq -r .name brand.json)"
          case "$ARCH" in
            x86-64) deb=amd64; appimage=amd64; rpm=x86_64; sbom=linux_amd64 ;;
            Arm) deb=arm64; appimage=aarch64; rpm=aarch64; sbom=linux_arm64 ;;
            *) echo "Unknown arch $ARCH" >&2; exit 1 ;;
          esac
          packages=("${name}_${version}_${deb}.deb" "${name}-${version}-1.${rpm}.rpm" "${name}_${version}_${appimage}.AppImage")
          expected=("${packages[@]}" "${name}_${version}_${sbom}.AppImage.cdx.json")
          # Exactly the files this build makes, and nothing else, so nothing
          # unexpected is signed or carried on to publish.
          # Every top-level entry, hidden ones included, with its type: each
          # expected one a regular file (f), and nothing more.
          diff <(printf '%s f\n' "${expected[@]}" | sort) \
            <(find release-files -mindepth 1 -maxdepth 1 -printf '%f %y\n' | sort)
          mkdir -p signed
          for f in "${expected[@]}"; do cp "release-files/$f" signed/; done
          for f in "${packages[@]}"; do
            bun tauri signer sign --app-version "$version" "signed/$f"
            if [ ! -s "signed/$f.sig" ]; then
              echo "$f has no .sig" >&2
              exit 1
            fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-signed-${{ matrix.arch }}
          path: signed/*
          if-no-files-found: error
          retention-days: 7

  # The software bills of materials (CycloneDX, DASA 1.5.1), one per
  # download, made by our own script from the lockfiles (`scripts/sbom.ts`),
  # in a job of its own: reading packages' licenses needs `bun install`,
  # which the publish job, with its write access, shouldn't run. The crates
  # a build script uses follow the computer that builds, so each download's
  # bill is made on the kind of computer that builds it: a Mac for the Mac
  # and Windows (cross-built there), and each Linux processor on its own.
  sbom:
    name: Software bills of materials (${{ matrix.os }})
    if: github.ref_type == 'tag'
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      matrix:
        os: [macos-latest, ubuntu-22.04, ubuntu-22.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true
      # Packages' own install scripts don't run: only their files are read.
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Make the bills of materials
        env:
          TAG: ${{ github.ref_name }}
        run: bun scripts/make-sbom.ts --version "${TAG#v}" --out sbom
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.os }}
          path: sbom/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish (a draft release)
    if: github.ref_type == 'tag'
    needs: [macos, windows, linux-sign, sbom]
    runs-on: ubuntu-latest
    # Its own environment: an approval of its own, to publish what the builds
    # made, and none of the signing secrets, which this job never needs.
    environment: publish
    timeout-minutes: 30
    permissions:
      contents: write # to create the release
      id-token: write # for the attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true
      # Each build's files in a folder of its own, then put together only if
      # no two have the same name: a merge would let one quietly replace
      # another (a file from one build standing in for another's).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "*-signed*"
          path: artifacts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "sbom-*"
          path: artifacts
      - name: Put the builds' files together
        run: |
          duplicates="$(find artifacts -type f -printf '%f\n' | sort | uniq -d)"
          if [ -n "$duplicates" ]; then
            echo "More than one build made: $duplicates" >&2
            exit 1
          fi
          mkdir -p build-outputs
          find artifacts -type f -exec mv {} build-outputs/ \;
      - name: Make the release files
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        # Checks every update signature against the app's public key and for
        # this version first, and makes nothing if any is wrong.
        run: |
          bun scripts/make-release-files.ts \
            --version "${TAG#v}" --repo "$REPO" \
            --from build-outputs --to release --notes "$RUNNER_TEMP/notes.md"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        with:
          subject-path: release/*
      # The provenance on the release as files too, which OpenSSF Scorecard's
      # Signed-Releases check reads (GitHub keeps the attestation in its own
      # store): the Sigstore bundle, and its signed statements as in-toto
      # lines. Made after the checksums and the attestation, so neither
      # lists them.
      - name: Put the provenance on the release
        env:
          TAG: ${{ github.ref_name }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: bun scripts/provenance-files.ts --bundle "$BUNDLE" --version "${TAG#v}" --to release
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=(--draft --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md")
          # A pre-release (0.2.0-beta.1) is marked as one, so it is never "latest".
          case "${TAG#v}" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" "${flags[@]}" release/*
