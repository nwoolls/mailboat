# Coverage-guided fuzzing of the code that reads untrusted email, with
# cargo-fuzz (libFuzzer). Its own workspace, so the app's build, lockfile and
# checks don't include it; it needs the nightly toolchain. How to run it is in
# fuzz/README.md; a weekly job runs it too (.github/workflows/fuzz.yml).
[package]
name = "mail-core-fuzz"
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# Builds structured inputs (a message's parts) from the fuzzer's bytes.
arbitrary = { version = "1", features = ["derive"] }
serde_json = "1"
mail-core = { path = "../crates/core", features = ["fuzzing"] }

[[bin]]
name = "sanitize_html"
path = "fuzz_targets/sanitize_html.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mailto_parse"
path = "fuzz_targets/mailto_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "original_read"
path = "fuzz_targets/original_read.rs"
test = false
doc = false
bench = false

[[bin]]
name = "gmail_message"
path = "fuzz_targets/gmail_message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "file_name"
path = "fuzz_targets/file_name.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
