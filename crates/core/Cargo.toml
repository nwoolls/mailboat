[package]
name = "mailboat-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Mailboat's sync, storage, auth and mail logic. No Tauri dependency, so it tests fast."

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
specta.workspace = true
rusqlite = { version = "0.40.2", features = ["bundled"] }
reqwest = { version = "0.13", features = ["json", "form", "query", "gzip"] }
async-trait = "0.1.92"
fastrand = "2.5.0"
base64 = "0.23.1"
url = "2.5.8"
encoding_rs = "0.8.42"
ammonia = "4.2.3"
lol_html = "3.0.1"
oauth2 = { version = "5", default-features = false }
mail-builder = { version = "1", default-features = false }
icalendar = { version = "0.17", default-features = false, features = ["parser"] }
chrono-tz = "0.10"
chrono = "0.4"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
wiremock = "0.6"

# OS keychain for refresh tokens (same per-platform setup as MonoCode).
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["linux-native-sync-persistent", "crypto-rust"] }
