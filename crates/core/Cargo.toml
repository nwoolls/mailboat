[package]
name = "mailboat-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Mailboat's sync, storage, auth and mail logic. No Tauri dependency, so it tests fast."

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
specta.workspace = true
rusqlite = { version = "0.40.2", features = ["bundled"] }
reqwest = { version = "0.13", features = ["json", "form", "query", "gzip"] }
async-trait = "0.1.92"
fastrand = "2.5.0"
base64 = "0.23.1"
url = "2.5.8"
encoding_rs = "0.8.42"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
wiremock = "0.6"
