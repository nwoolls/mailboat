[package]
name = "mail-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The app's sync, storage, auth and mail logic. No Tauri dependency, so it tests fast."

[lints]
workspace = true

[lib]
# No doc examples to test; skipping the search keeps `cargo test` fast.
doctest = false

[build-dependencies]
serde_json.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
specta.workspace = true
rusqlite = { version = "0.43.0", features = ["bundled"] }
reqwest = { version = "0.13", features = ["json", "form", "query", "gzip"] }
async-trait = "0.1.92"
fastrand = "2.5.0"
base64 = "0.23.1"
url = "2.5.9"
# Decodes mailto: links; from the url crate's authors, already in the build.
percent-encoding = "2.3.2"
encoding_rs = "0.8.42"
ammonia = "4.2.5"
lol_html = "3.0.1"
# Reads emails' style sheets (mail::stylesheet); Servo's, already in the
# build through ammonia.
cssparser = "0.38"
# The writing assistant's Markdown (lists, bold, tables) as email HTML
# (ai::format); the most used Rust Markdown parser.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
oauth2 = { version = "5", default-features = false }
mail-builder = { version = "2", default-features = false }
icalendar = { version = "0.17", default-features = false, features = ["parser"] }
jiff = "1.0"
mail-parser = "1.0.0"
# The MCP server for AI apps (`mcp`): the official Rust SDK. Client too,
# for the app's `--mcp` proxy that forwards to the running app.
rmcp = { version = "3.9", features = ["server", "client", "macros", "schemars", "transport-io", "transport-async-rw"] }
schemars = "1.1"
# The AI programs' working folder (`ai::process`): made private and
# atomically, and removed with what's in it on every way out. Already in
# the build through other crates.
tempfile = "3.27"
# The mail cache's key: random bytes from the system (`db::cache`), and,
# for the cached files, their encryption. Already in the app through
# rustls, its TLS provider; default features add only `untrusted`.
aws-lc-rs = "1.18"
# Wipes the cache's key from memory when it's dropped (`db::cache`); in
# the build already through aws-lc-rs.
zeroize = "1.9"

[features]
# Exposes the checks the fuzz target in `fuzz/` runs (`mail::sanitize_check`).
# Off in the app.
fuzzing = []

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
wiremock = "0.6"
# Property tests for the code that reads untrusted email (random input, with
# the failing case shrunk to its smallest form).
proptest = "1"

# OS keychain for refresh tokens (same per-platform setup as MonoCode).
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }
# Owner-only access lists (`owner_only`): Microsoft's own bindings, already
# in the build through other crates.
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
# `O_NOFOLLOW` for `owner_only`, which the standard library doesn't name;
# already in the build.
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# Sign-in tokens in the desktop's keyring (GNOME Keyring, KWallet) through the
# Secret Service, and only there: not also in the kernel's keyring, as the
# `linux-native-sync-persistent` store would (see ARCHITECTURE, decisions).
keyring = { version = "3.6", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
# The data folder (`brand::data_dir`), found as Tauri finds it: Tauri's own
# crate and version, already in the Linux build.
dirs = "7"
