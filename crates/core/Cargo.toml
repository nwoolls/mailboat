[package]
name = "mail-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The app's sync, storage, auth and mail logic. No Tauri dependency, so it tests fast."

[lib]
# No doc examples to test; skipping the search keeps `cargo test` fast.
doctest = false

[build-dependencies]
serde_json.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
specta.workspace = true
rusqlite = { version = "0.41.1", features = ["bundled"] }
reqwest = { version = "0.13", features = ["json", "form", "query", "gzip"] }
async-trait = "0.1.92"
fastrand = "2.5.0"
base64 = "0.23.1"
url = "2.5.8"
# Decodes mailto: links; from the url crate's authors, already in the build.
percent-encoding = "2.3.2"
encoding_rs = "0.8.42"
ammonia = "4.2.3"
lol_html = "3.0.1"
# Reads emails' style sheets (mail::stylesheet); Servo's, already in the
# build through ammonia.
cssparser = "0.38"
# The writing assistant's Markdown (lists, bold, tables) as email HTML
# (ai::format); the most used Rust Markdown parser.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
oauth2 = { version = "5", default-features = false }
mail-builder = { version = "2", default-features = false }
icalendar = { version = "0.17", default-features = false, features = ["parser"] }
chrono-tz = "0.10"
chrono = "0.4"
mail-parser = "1.0.0"
# The MCP server for AI apps (`mcp`): the official Rust SDK. Client too,
# for the app's `--mcp` proxy that forwards to the running app.
rmcp = { version = "3.9", features = ["server", "client", "macros", "schemars", "transport-io", "transport-async-rw"] }
schemars = "1.1"

[features]
# Exposes the checks the fuzz target in `fuzz/` runs (`mail::sanitize_check`).
# Off in the app.
fuzzing = []

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
wiremock = "0.6"
# Property tests for the code that reads untrusted email (random input, with
# the failing case shrunk to its smallest form).
proptest = "1"

# OS keychain for refresh tokens (same per-platform setup as MonoCode).
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["linux-native-sync-persistent", "crypto-rust"] }
