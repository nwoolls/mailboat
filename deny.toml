# Dependency checks, run by .github/workflows/audit.yml. The app is
# GPL-3.0-only, so every crate must carry a licence GPL-3.0 can include.

[graph]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-pc-windows-msvc"]

[advisories]
version = 2
ignore = [
  # `paste` is unmaintained, not vulnerable, and comes in through Tauri's
  # dependencies (no upgrade exists). Revisit when Tauri drops it.
  { id = "RUSTSEC-2024-0436", reason = "unmaintained only; transitive through Tauri" },
]

[licenses]
version = 2
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "Unlicense",
  "0BSD",
  "CC0-1.0",
  "BSL-1.0",
  "GPL-3.0-only", # the app's own crates
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
