# Dependency checks, run by .github/workflows/audit.yml. The app is
# GPL-3.0-only, so every crate must carry a licence GPL-3.0 can include.

[graph]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
]

[advisories]
version = 2
# Unsound advisories for every crate, dependencies included, not only the
# app's own (the default). That default let `rustix` 1.1.5 through.
unsound = "all"
ignore = [
  # `paste` is unmaintained, not vulnerable, and comes in through Tauri's
  # dependencies (no upgrade exists). Revisit when Tauri drops it.
  { id = "RUSTSEC-2024-0436", reason = "unmaintained only; transitive through Tauri" },
  # `chrono` is unmaintained (2026-11), not vulnerable, with no maintained
  # release to move to. It comes in through oauth2 (Google sign-in),
  # icalendar (invitations), rmcp (AI apps) and schemars; the app's own dates
  # and time zones use `jiff` (and `chrono-tz` is gone with that move).
  { id = "RUSTSEC-2026-0543", reason = "chrono: unmaintained only; through oauth2, icalendar, rmcp, schemars" },
  # Linux only. Tauri's GTK web view pins glib 0.18 (the fix is in 0.20).
  # The unsound code is `VariantStrIter` (`Variant::array_iter_str`), which
  # nothing in the build calls: not the app, Tauri, wry, tao, muda, gtk,
  # webkit2gtk, gio or soup3 (searched 2026-11-24).
  { id = "RUSTSEC-2024-0429", reason = "glib: Linux only, pinned by Tauri; the unsound VariantStrIter is never called" },
  # Linux only, unmaintained, not vulnerable: a compile-time macro of gtk's.
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error: unmaintained only; a compile-time macro (gtk, Linux)" },
  # Linux only, unmaintained, not vulnerable: D-Bus types under zbus, which
  # desktop notifications and the single-instance plugin use there.
  { id = "RUSTSEC-2026-0370", reason = "zvariant: unmaintained only; Linux D-Bus (notifications, single instance)" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names: unmaintained only; Linux D-Bus (notifications, single instance)" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: unmaintained only; Linux D-Bus (notifications, single instance)" },
]

[licenses]
version = 2
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "Unlicense",
  "0BSD",
  "CC0-1.0",
  "BSL-1.0",
  "GPL-3.0-only", # the app's own crates
]
confidence-threshold = 0.9
# Linux only, at build time: target-lexicon is how system-deps (which finds
# GTK and WebKitGTK when gtk's build scripts run) reads the target. LLVM's
# exception only adds permissions to Apache-2.0, and none of it ships.
exceptions = [{ allow = ["Apache-2.0 WITH LLVM-exception"], crate = "target-lexicon" }]

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
