[workspace]
resolver = "2"
members = ["crates/core", "src-tauri"]
# A copy of another project's crate (see the patch below): not ours to lint
# or test.
exclude = ["vendor/libsqlite3-sys"]

[workspace.package]
# Not the app's version: that is written once, in package.json (read by
# crates/core/build.rs as `brand::VERSION`; tauri.conf.json points at it).
# The crates are never published, so this stays put.
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-only"

# Every `unsafe` block says why it is sound in a `// SAFETY:` comment just
# above it; CI's `clippy -D warnings` fails one that doesn't. (The desktop
# security profile asks about memory safety; the comments are the answer.)
[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "time",
  "net",
  "io-util",
  "process",
] }
# Specta is pre-release; pin exactly as tauri-specta's docs require.
specta = { version = "=2.0.0-rc.25", features = ["derive"] }

# Release builds drop the symbol table as well as debug info (Cargo's
# default keeps symbols), so a shipped binary names none of its functions
# (DASA 1.8.2). The macOS AI helper is Swift, built outside this profile:
# `src-tauri/build.rs` strips it in release builds. A panic message still
# says what and where; its backtrace would show addresses only, and the app
# collects none.
[profile.release]
strip = true

# The local cache's SQLite is SQLite3 Multiple Ciphers, an encrypting build
# of SQLite, compiled by this copy of rusqlite's `libsqlite3-sys` in place of
# plain SQLite (rusqlite doesn't offer it). The version must match the one
# rusqlite asks for, or Cargo ignores the patch with only a warning, and
# `db::tests::the_cipher_is_linked` fails. Upgrading: docs/DEVELOPMENT.md ->
# "The encrypting SQLite".
[patch.crates-io]
libsqlite3-sys = { path = "vendor/libsqlite3-sys" }
