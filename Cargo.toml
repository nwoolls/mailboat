[workspace]
resolver = "2"
members = ["crates/core", "src-tauri"]

[workspace.package]
# Not the app's version: that is written once, in package.json (read by
# crates/core/build.rs as `brand::VERSION`; tauri.conf.json points at it).
# The crates are never published, so this stays put.
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-only"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "time",
  "net",
  "io-util",
  "process",
] }
# Specta is pre-release; pin exactly as tauri-specta's docs require.
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
