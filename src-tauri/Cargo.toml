[package]
name = "desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A fast, keyboard-first Gmail client: the desktop app (Tauri)"

[lib]
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
# No doc examples to test, and looking for them rebuilt the whole app
# (about 90 s of every `cargo test`).
doctest = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mail-core = { path = "../crates/core" }
tauri = { version = "2", features = ["macos-private-api"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
specta.workspace = true
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta-typescript = "0.0.12"
open = "5"
time = { version = "0.3.55", features = ["formatting"] }
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"

# Already part of the build through Tauri; declared to set the Dock picture
# (src/dock.rs) and to read trackpad phases (src/trackpad.rs).
# Same versions as Tauri and MonoCode.
# Windows: a mailto: link clicked while Mailboat is open starts a second copy,
# which hands the link to the running one and quits (src/lib.rs).
[target.'cfg(windows)'.dependencies]
tauri-plugin-single-instance = "2"
# Which app Windows sends mailto: links to (src/mail_handler.rs). Microsoft's
# crate, already in the build through Tauri.
windows-registry = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# NSWorkspace: which app opens mailto: links, and making Mailboat it (src/mail_handler.rs).
# NSMenu, NSMenuItem, NSView and NSPasteboard: Mailboat's own menu over
# images and links in emails, and its Copy Image / Copy Link (src/email_menu.rs).
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSDockTile", "NSImage", "NSResponder", "NSEvent", "NSWorkspace", "NSMenu", "NSMenuItem", "NSView", "NSPasteboard", "NSUserInterfaceItemIdentification", "block2"] }
# NSData, to turn a chosen app icon's PNG into an NSImage (src/dock.rs);
# NSBundle, NSURL, NSString and NSError for src/mail_handler.rs.
objc2-foundation = { version = "0.3", features = ["NSData", "NSBundle", "NSURL", "NSString", "NSError", "NSArray", "NSGeometry"] }
# The trackpad monitor's handler (src/trackpad.rs); same version as Tauri's.
block2 = "0.6"
# New-mail notifications through macOS's own notification center, so a
# click can open its conversation (src/notifications.rs); the notification
# plugin can't report clicks on macOS. Same family and version as above.
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "bitflags", "block2", "UNUserNotificationCenter", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSound", "UNNotificationTrigger"] }
