[package]
name = "mailboat"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Mailboat — a fast, keyboard-first Gmail client"

[lib]
name = "mailboat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mailboat-core = { path = "../crates/core" }
tauri = { version = "2", features = ["macos-private-api"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
specta.workspace = true
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta-typescript = "0.0.12"
open = "5"
time = { version = "0.3.55", features = ["formatting"] }
tauri-plugin-window-state = "2"

# Already part of the build through Tauri; declared to clear Tauri's dev
# Dock picture (src/dock.rs). Same versions as Tauri and MonoCode.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSDockTile", "NSImage", "NSResponder"] }
