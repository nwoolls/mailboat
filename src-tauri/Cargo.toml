[package]
name = "desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A fast, keyboard-first Gmail client: the desktop app (Tauri)"

[lib]
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
# No doc examples to test, and looking for them rebuilt the whole app
# (about 90 s of every `cargo test`).
doctest = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lints]
workspace = true

[dependencies]
mail-core = { path = "../crates/core" }
tauri = { version = "2", features = ["macos-private-api"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
specta.workspace = true
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta-typescript = "0.0.12"
open = "5"
# The XDG data folders, where Linux keeps desktop entries (src/mail_handler.rs).
# Tauri's own crate and version, already in the build on every platform.
dirs = "7"
time = { version = "0.3.55", features = ["formatting"] }
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"
# The app updating itself (src/updates.rs): Rust only, with no web permission.
# Its own TLS switch (`rustls-tls`) would add the `ring` crypto library and make
# it the process default, a second one beside `aws-lc-rs`, which the app's
# network code already uses, and `ring` doesn't cross-compile for Windows ARM64
# with cargo-xwin. So its defaults are off: it uses the TLS the app already has
# (reqwest's, through mail-core), and keeps only the system proxy setting. `zip`
# is for Tauri v1 bundles; ours are a tarball (Mac) and an installer (Windows).
tauri-plugin-updater = { version = "2", default-features = false, features = ["system-proxy"] }

# Already part of the build through Tauri; declared to set the Dock picture
# (src/dock.rs) and to read trackpad phases (src/trackpad.rs).
# Same versions as Tauri and MonoCode.
# Windows and Linux: opening the app (or a mailto: link) while it's open starts
# a second copy, which hands over to the running one and quits (src/lib.rs).
# On Linux it talks over D-Bus with zbus, already in the build.
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

# Linux: new-mail notifications that report a click, and can be taken back,
# over one D-Bus connection (src/notifications.rs). The notification plugin
# doesn't pass clicks on. zbus is already in the Linux build, with these
# features, through that plugin and the single-instance plugin.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

[target.'cfg(windows)'.dependencies]
# Which app Windows sends mailto: links to (src/mail_handler.rs). Microsoft's
# crate, already in the build through Tauri.
windows-registry = "0.100"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# NSWorkspace: which app opens mailto: links, and making the app it (src/mail_handler.rs).
# NSMenu, NSMenuItem, NSView and NSPasteboard: the app's own menu over
# images and links in emails, and its Copy Image / Copy Link (src/email_menu.rs).
# NSPrintInfo, NSPrintOperation and NSWindow: printing with margins (src/print.rs).
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSDockTile", "NSImage", "NSResponder", "NSEvent", "NSWorkspace", "NSMenu", "NSMenuItem", "NSView", "NSPasteboard", "NSUserInterfaceItemIdentification", "NSPrintInfo", "NSPrintOperation", "NSWindow", "block2"] }
# WKWebView's print operation, with the app's own margins (src/print.rs).
# Same version as Wry's, which Tauri already builds.
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "objc2-app-kit", "WKWebView"] }
# NSData, to turn a chosen app icon's PNG into an NSImage (src/dock.rs);
# NSBundle, NSURL, NSString and NSError for src/mail_handler.rs;
# NSNotification, NSOperation and block2 to watch the tooltip window show
# (src/tooltips.rs).
objc2-foundation = { version = "0.3", features = ["NSData", "NSBundle", "NSURL", "NSString", "NSError", "NSArray", "NSGeometry", "NSNotification", "NSOperation", "block2"] }
# The trackpad monitor's handler (src/trackpad.rs); same version as Tauri's.
block2 = "0.6"
# New-mail notifications through macOS's own notification center, so a
# click can open its conversation (src/notifications.rs); the notification
# plugin can't report clicks on macOS. Same family and version as above.
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "bitflags", "block2", "UNUserNotificationCenter", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSound", "UNNotificationTrigger"] }
